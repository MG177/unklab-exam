<svg width="1440" height="1024" viewBox="0 0 1440 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1b81c4"/>
      <stop offset="55%" stop-color="#166aa3"/>
      <stop offset="100%" stop-color="#0d4b75"/>
    </linearGradient>
    <radialGradient id="glow-top" cx="78%" cy="12%" r="52%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#e7f2fb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1b81c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-bottom" cx="18%" cy="88%" r="48%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#166aa3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0d4b75" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-center" cx="50%" cy="45%" r="35%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1b81c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="1024" fill="url(#bg)"/>
  <rect width="1440" height="1024" fill="url(#glow-top)"/>
  <rect width="1440" height="1024" fill="url(#glow-bottom)"/>
  <rect width="1440" height="1024" fill="url(#glow-center)"/>

  <!-- Soft decorative shapes -->
  <circle cx="1180" cy="180" r="220" fill="#e7f2fb" fill-opacity="0.14"/>
  <circle cx="220" cy="820" r="280" fill="#0d4b75" fill-opacity="0.22"/>
  <circle cx="1320" cy="760" r="160" fill="#ffffff" fill-opacity="0.06"/>
  <ellipse cx="680" cy="980" rx="520" ry="120" fill="url(#wave)"/>

  <!-- Subtle top edge highlight -->
  <rect x="0" y="0" width="1440" height="3" fill="#e7f2fb" fill-opacity="0.35"/>
</svg>
